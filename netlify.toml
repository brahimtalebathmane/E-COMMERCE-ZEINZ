# Next.js: do not set publish — @netlify/plugin-nextjs handles output + runtime.
#
# Netlify → Site configuration → Environment variables: set these for Production
# (and Preview if you use it). Values must match your Supabase project; copy
# from a local .env.local — do not commit secrets to git.
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   (server-only; required for /api/orders, uploads, etc.)
#   ORDER_ACTION_SECRET         (min 16 chars; HMAC for post-checkout order actions — required for /api/orders)
#   NEXT_PUBLIC_SITE_URL        (your live URL, e.g. https://yoursite.netlify.app)
#   META_CAPI_ACCESS_TOKEN      (Business Manager system user token for the unified pixel)
#   META_CAPI_TEST_EVENT_CODE   (optional; e.g. TEST24694 — required for CAPI rows in Meta Test Events)
#   NEXT_PUBLIC_META_PIXEL_ID   (browser Pixel fallback — used when a country has no pixel set)
#   META_PIXEL_ID               (server CAPI fallback — used when a country has no pixel set)
#   GET /api/meta/health        (validates env; errors if pixel IDs mismatch — stays env/global, not per-country)
#   countries.meta_pixel_id_public/server  (per-country pixel — set in /admin/countries; takes priority over the env vars above)
#   products.meta_pixel_id      (LEGACY in DB — ignored for routing; superseded by countries.meta_pixel_id_*)
#
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."meta-stuck-events-scheduled"]
  schedule = "*/30 * * * *"

# Stamps x-visitor-country-code on "/" only, for the homepage catalog's
# geo-filter (see netlify/edge-functions/geo-country.ts). Deliberately not
# applied to /[slug] landing pages — ad traffic/shared links must always load.
[[edge_functions]]
  function = "geo-country"
  path = "/"

[build.environment]
  NODE_VERSION = "20"
